<style>
:root {

}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151514; --panel: #1e1e1c; --side: #1a1a19; --text: #ecebe6; --muted: #a3a19a;
    --line: #2f2e2b; --accent: #8ea8ff; --accent-soft: #232a40; --chip: #2a2927;
    --t-arch: #a993ff; --t-flow: #5fd19c; --t-seq: #f0a35e; --t-data: #ef79ad; --t-state: #5cc8e3; --t-doc: #aaa;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
html[data-lang="vi"] [data-l="en"], html[data-lang="en"] [data-l="vi"] { display: none; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 8px; top: 8px; background: var(--panel); padding: 6px 10px; z-index: 10; }

.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side-head { padding: 20px 18px 12px; border-bottom: 1px solid var(--line); }
.crumb { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
.brand { font-weight: 650; font-size: 17px; line-height: 1.3; margin: 0; }
.tools { display: flex; gap: 8px; margin-top: 12px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.lang button { border: 0; background: transparent; color: var(--muted); padding: 5px 9px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.search { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 13px; }
.nav { padding: 10px 10px 30px; }
.nav h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 8px 6px; }
.nav ul { list-style: none; margin: 0; padding: 0; }
.nav li a { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 7px; color: var(--text); font-size: 14px; }
.nav li a:hover { background: var(--accent-soft); text-decoration: none; }
.nav li a .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); background: var(--t-doc); }

.main { padding: 36px clamp(16px, 4vw, 56px) 40px; max-width: 1180px; width: 100%; }
.hero h1 { font-size: clamp(24px, 3vw, 32px); line-height: 1.2; margin: 0 0 10px; }
.hero p { color: var(--muted); max-width: 72ch; margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.facts li { background: var(--chip); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--muted); }
.facts b { color: var(--text); font-weight: 600; }
section.group { margin-top: 38px; }
section.group > h2 { font-size: 19px; margin: 0 0 4px; }
section.group > p { color: var(--muted); margin: 0 0 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; margin-top: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.card:hover { border-color: var(--accent); }
.card h3 { margin: 0; font-size: 16px; line-height: 1.35; }
.card h3 a { color: var(--text); }
.card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 2px 7px; background: var(--chip); color: var(--muted); }
.badge.type { color: #fff; background: var(--t-doc); }
.card .open { font-size: 13px; font-weight: 600; }
.langs { font-size: 12px; color: var(--muted); }
[data-type="architecture"], [data-type="tree"], [data-type="class"] { --tc: var(--t-arch); }
[data-type="workflow"] { --tc: var(--t-flow); }
[data-type="sequence"], [data-type="waterfall"], [data-type="timeline"] { --tc: var(--t-seq); }
[data-type="erd"], [data-type="dataflow"] { --tc: var(--t-data); }
[data-type="lifecycle"] { --tc: var(--t-state); }
[data-type] .badge.type, .nav a[data-type] .dot { background: var(--tc, var(--t-doc)); }
.empty { color: var(--muted); display: none; margin-top: 24px; }
.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.hidden { display: none !important; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { max-height: 46vh; overflow-y: auto; }
  .main { padding-top: 24px; }
}

</style>
</head>
<body>
<a class="skip" href="#main"><span data-l="vi">Bỏ qua menu</span><span data-l="en">Skip to content</span></a>
<div class="shell">
  <aside class="side" aria-label="Sidemap">
    <div class="side-head">
      <p class="brand">Tài liệu kiến trúc &amp; luồng nghiệp vụ</p>
      <div class="tools">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-set-lang="vi" aria-pressed="true">VI</button>
          <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
        <input class="search" type="search" placeholder="Tìm trang… / Search…" aria-label="Search pages">
      </div>

    <nav class="nav">
      
      <div class="nav-group"><ul>

      </ul></div>

  <main id="main" class="main">
    
    <header class="hero">
      <h1>Tài liệu kiến trúc &amp; luồng nghiệp vụ</h1>
      <p>Mỗi dự án là một bộ sơ đồ: hành trình người dùng, kiến trúc, dữ liệu.</p>
    </header>
    <section class="group">
      <div class="cards">

      </div>

<script>
(function () {
  var root = document.documentElement;
  var KEY = 'cw-lang';
  var available = (root.getAttribute('data-langs') || 'vi').split(',');

  function setLang(lang) {
    if (available.indexOf(lang) < 0) lang = available[0];
    root.setAttribute('data-lang', lang);
    root.setAttribute('lang', lang);
    document.querySelectorAll('[data-set-lang]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-set-lang') === lang));
      b.hidden = available.indexOf(b.getAttribute('data-set-lang')) < 0;
    });
    // Each page link carries one href per language; fall back to any file that exists.
    document.querySelectorAll('a[data-page]').forEach(function (a) {
      var href = a.getAttribute('data-href-' + lang);
      if (!href) available.some(function (l) { return (href = a.getAttribute('data-href-' + l)); });
      if (href) a.setAttribute('href', href);
    });
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  }

  // ?lang=xx (from a page breadcrumb) wins over the remembered choice.
  var saved = null;
  var m = /[?&]lang=([a-zA-Z-]+)/.exec(location.search);
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  setLang((m && m[1]) || saved || root.getAttribute('data-lang') || available[0]);
  document.querySelectorAll('[data-set-lang]').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-set-lang')); });
  });

  var search = document.querySelector('.search');
  if (search) search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase();
    var shown = 0;
    document.querySelectorAll('[data-search]').forEach(function (el) {
      var hit = !q || el.getAttribute('data-search').indexOf(q) >= 0;
      el.classList.toggle('hidden', !hit);
      if (hit && el.classList.contains('card')) shown++;
    });
    document.querySelectorAll('section.group, .nav-group').forEach(function (g) {
      g.classList.toggle('hidden', !g.querySelector('[data-search]:not(.hidden)'));
    });
    var empty = document.querySelector('.empty');
    if (empty) empty.style.display = shown ? 'none' : 'block';
  });
})();

</script>
</body>
